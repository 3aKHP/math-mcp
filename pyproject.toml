[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "math-mcp"
dynamic = ["version"]
description = "Math MCP Server — symbolic computation, calculus, linear algebra, number theory, statistics, and unit conversion via MCP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "3aKHP", url = "https://github.com/3aKHP" },
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "math",
    "symbolic-computation",
    "sympy",
    "calculus",
    "linear-algebra",
    "statistics",
    "unit-conversion",
    "claude",
    "anthropic",
    "ai-agent",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.6.0",
    "sympy>=1.12",
]

[project.urls]
Homepage = "https://github.com/3aKHP/math-mcp"
Repository = "https://github.com/3aKHP/math-mcp"
Changelog = "https://github.com/3aKHP/math-mcp/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/3aKHP/math-mcp/issues"

[project.scripts]
math-mcp = "math_mcp.server:main"

[tool.hatch.version]
path = "src/math_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/math_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
